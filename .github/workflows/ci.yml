name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # gitleaks-action lists the pull request's commits to scan them.
  pull-requests: read

jobs:
  # One job named ci: it is the required status check on main, so steps are
  # added to it rather than split into new jobs.
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The Go CI runs must be exactly go.mod's (toolchain line, else go line).
      - name: Go version matches go.mod
        run: |
          want=$(awk '/^toolchain /{t=$2} /^go /{g="go"$2} END{print (t != "" ? t : g)}' go.mod)
          got=$(go env GOVERSION)
          echo "go.mod: $want · CI: $got"
          test -n "$want" && test "$got" = "$want"

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod
          if [ -f go.sum ]; then git diff --exit-code go.sum; fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet -tags integration ./...

      - name: Shell scripts parse
        run: for f in scripts/*.sh deploy/*.sh deploy/*/*.sh; do bash -n "$f"; done

      # staticcheck runs inside golangci-lint (enabled in .golangci.yml).
      # Built with the job's Go: prebuilt binaries use an older Go and refuse
      # a module targeting a newer one.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          install-mode: goinstall
          verify: false
          args: --build-tags integration

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: OpenAPI matches the swag annotations
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          ./scripts/openapi.sh
          git diff --exit-code internal/httpapi/openapi

      # Unit, golden, route-guard and seed tests.
      - name: Test
        run: go test -race -count=1 -timeout=300s ./...

      # PostgreSQL 17 through testcontainers: migrations up/down/up, row-level
      # security across owners, one audit event per write, hash chain, step-up.
      - name: Integration tests
        run: go test -tags integration -race -count=1 -timeout=600s ./internal/itest

      - name: Build with version stamping
        run: |
          go build -ldflags "-X github.com/ovander/backendkit/buildinfo.Version=${GITHUB_SHA::12} \
            -X github.com/ovander/backendkit/buildinfo.GitCommit=${GITHUB_SHA} \
            -X github.com/ovander/backendkit/buildinfo.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o tenure ./cmd/tenure
          ./tenure version
