version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - misspell
    - revive
  settings:
    misspell:
      # User-facing strings are French (CLAUDE.md, Language); these are
      # correct French words, not misspelt English.
      ignore-rules: [partiel, exemple, chambre, chambres]
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    rules:
      # httptest handlers in tests routinely ignore Write/Encode errors.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
