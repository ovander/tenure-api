# Local development services (RENT-SPEC roadmap, dev environment): PostgreSQL 17,
# an S3-compatible archive (RustFS, Q-38), gotenberg (HTML → PDF) and Mailpit. Socrate runs
# separately. Every password here is a dev-only placeholder; never reuse one.
#
#   docker compose -f docker-compose.dev.yml up -d
#   cp .env.example .env   # then fill the Socrate values
#   set -a; . ./.env; set +a
#   go run ./cmd/tenure migrate up && go run ./cmd/tenure serve
name: tenure-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev-only-superuser
      POSTGRES_DB: tenure
      TENURE_MIGRATE_PW: dev-only-migrate
      TENURE_API_PW: dev-only-api
      TENURE_JOBS_PW: dev-only-jobs
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/sql/roles.sql:/tenure/roles.sql:ro
      - ./deploy/dev/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenure"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The archive: an S3-compatible store with versioning and object lock.
  # RustFS stands in for MinIO, whose image cannot be pulled (Q-38). Create
  # the bucket with object lock once:
  #   docker compose -f docker-compose.dev.yml run --rm archive-init
  archive:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: dev-only-archive
      RUSTFS_SECRET_KEY: dev-only-archive-secret
    ports: ["127.0.0.1:9000:9000"]
    volumes:
      - archivedata:/data

  archive-init:
    profiles: ["init"]
    image: amazon/aws-cli:2.27.0
    depends_on: [archive]
    environment:
      AWS_ACCESS_KEY_ID: dev-only-archive
      AWS_SECRET_ACCESS_KEY: dev-only-archive-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["aws", "--endpoint-url", "http://archive:9000", "s3api", "create-bucket",
                 "--bucket", "tenure-dev", "--object-lock-enabled-for-bucket"]

  # Catches every e-mail on http://127.0.0.1:8025 (SMTP on 1025).
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  gotenberg:
    image: gotenberg/gotenberg:8.21
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
  archivedata:
